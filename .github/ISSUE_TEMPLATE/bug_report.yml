name: Bug report
description: Report a reproducible product or engineering defect without personal data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include children's names, homework images, phone numbers, recordings, transcripts, credentials, or production data. Use synthetic examples."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: State the observed behavior and user impact.
      placeholder: Use a synthetic example.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands, synthetic input, and exact output.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Highest plausible severity
      options: [P0 child safety or data exposure, P1 release blocker, P2 degraded behavior, P3 minor]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I used only synthetic/de-identified content and removed all credentials.
          required: true
